# Builds both images, pushes them to GHCR, and rolls the deployment.
#
# Plan Step 11. **There is no client secret anywhere in this file or in the
# repository's secrets.** Azure trusts a short-lived token GitHub mints for this
# workflow, exchanged through a federated credential whose subject is pinned to
# `repo:JustinRheyDavid/H-1B-Tech-Salary-Explore:ref:refs/heads/main`. That
# subject is matched exactly and is case-sensitive; a wrong slug fails at token
# exchange with AADSTS700213, which does not name the string it rejected.
#
# The three `vars.AZURE_*` below are repository *variables*, not secrets. None
# of them is sensitive: a client id, a tenant id and a subscription id are
# useless without the federated trust, and that trust names this repository and
# this branch.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write   # push to GHCR
  id-token: write   # mint the OIDC token Azure exchanges

# Never two deployments at once, and never cancel one midway: a half-applied
# ARM deployment is worse than a queued one.
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  # GHCR paths must be lowercase. Written out rather than derived from
  # github.repository, whose capitalization would not survive the push.
  WEB_IMAGE: ghcr.io/justinrheydavid/h-1b-tech-salary-explore-web
  ETL_IMAGE: ghcr.io/justinrheydavid/h-1b-tech-salary-explore-etl

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tagged with the commit SHA as well as `latest`, and the SHA is what
      # gets deployed. Container Apps creates a new revision when the image
      # *reference* changes — redeploying `:latest` over itself leaves the old
      # revision serving, which would make "a commit to main rolls a new
      # revision" quietly untrue.
      - name: Build and push the dashboard
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          push: true
          tags: ${{ env.WEB_IMAGE }}:${{ github.sha }},${{ env.WEB_IMAGE }}:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Build and push the ETL job
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.etl
          push: true
          tags: ${{ env.ETL_IMAGE }}:${{ github.sha }},${{ env.ETL_IMAGE }}:latest
          cache-from: type=gha,scope=etl
          cache-to: type=gha,mode=max,scope=etl

  deploy:
    needs: images
    runs-on: ubuntu-latest
    outputs:
      fqdn: ${{ steps.apply.outputs.fqdn }}
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # webImage and webTargetPort move together, always. The port is 80 for
      # the quickstart placeholder and 8501 for the real Streamlit image, and a
      # mismatch does not fail the deployment — it succeeds and serves nothing.
      # That is why they are separate parameters with no defaults.
      #
      # `assignRoles=false` skips the one resource this principal cannot write.
      # Creating a role assignment needs `Microsoft.Authorization/roleAssignments/write`
      # and this principal is Contributor, which does not have it — the first run
      # of this workflow deployed everything else and then failed on exactly that
      # resource. The alternative was to grant it Role Based Access Control
      # Administrator, which would let anyone who can push to `main` grant
      # themselves roles in this resource group. Skipping a resource that already
      # exists and is already correct is the smaller cost. The parameter defaults
      # to `true`, so a first deployment by a human owner still creates it.
      #
      # **The gap this leaves, stated rather than hidden:** if the ETL job is
      # deleted and recreated, its principal ID changes and CI will not grant the
      # new one blob access. The job then fails at runtime with
      # AuthorizationPermissionMismatch. Fix: one deployment by hand without this
      # flag. See runbook §4d.
      - name: Deploy infrastructure and roll the images
        id: apply
        run: |
          set -euo pipefail
          az deployment group create \
            --resource-group rg-h1b \
            --template-file infra/main.bicep \
            --parameters infra/main.parameters.json \
            --parameters \
              webImage=${{ env.WEB_IMAGE }}:${{ github.sha }} \
              webTargetPort=8501 \
              etlImage=${{ env.ETL_IMAGE }}:${{ github.sha }} \
              assignRoles=false \
            --query "properties.outputs.webAppFqdn.value" -o tsv > fqdn.txt
          echo "fqdn=$(cat fqdn.txt)" >> "$GITHUB_OUTPUT"
          echo "Deployed to https://$(cat fqdn.txt)"

      # Before waiting on health, ask whether the revision even started.
      #
      # A revision that cannot pull its image fails asynchronously: the ARM
      # deployment above still *succeeds*, because it validates the image
      # reference rather than fetching it. Without this step the next one runs 60
      # attempts over 300 seconds and reports "never returned 200 from
      # /_stcore/health" — a message about health when the cause is a pull, which
      # is the wrong subsystem and five minutes late. Same failure shape as
      # retrying a permissions error as if it were a paused database.
      #
      # **A correction to what this comment used to say.** It claimed GHCR
      # publishes packages private by default and that making them public was a
      # required manual step. Observed on the first run: both packages were
      # created `public` with no intervention (`gh api user/packages
      # --jq '.[] | "\(.name) \(.visibility)"'`). The guard below is still worth
      # its ten lines — a failed pull is a real way to reach a Failed revision —
      # but it is not the only one, so the error message no longer asserts a
      # cause it cannot know.
      #
      # If a pull *is* the cause, the fix is to make the package public rather
      # than to add a GHCR token in `registries.passwordSecretRef`, which would
      # reintroduce exactly the secret this workflow exists to avoid.
      - name: Check the revision provisioned before blaming health
        run: |
          set -euo pipefail
          expected="${{ env.WEB_IMAGE }}:${{ github.sha }}"
          for attempt in $(seq 1 30); do
            # Selected by image, not by createdTime. `[-1]` on createdTime returns
            # the PREVIOUS revision until the new one exists, and the previous one
            # is Provisioned — so the check would pass instantly without ever
            # looking at what this run deployed.
            state=$(az containerapp revision list -g rg-h1b -n h1b-web \
              --query "[?properties.template.containers[0].image=='${expected}'] | sort_by([], &properties.createdTime)[-1].properties.provisioningState" -o tsv)
            echo "revision provisioningState for this image: ${state:-<not created yet>}"
            case "$state" in
              Provisioned) exit 0 ;;
              Failed)
                echo "::error::The new revision failed to provision — the deployment"
                echo "::error::succeeded but the container never started. Check the system"
                echo "::error::logs below; a pull failure (private GHCR package) and a"
                echo "::error::crash on startup both land here and read differently."
                az containerapp logs show -n h1b-web -g rg-h1b --type system --tail 30 || true
                exit 1 ;;
            esac
            sleep 10
          done
          echo "::warning::revision still not Provisioned after 300s; continuing to the health check"

      # The acceptance criterion, measured rather than assumed. minReplicas is
      # 0, so this request is a genuine cold start: image pull, Python import,
      # Streamlit boot, and possibly a serverless database resume behind it.
      #
      # The plan's budget is 30 seconds. This step reports the real number and
      # does not fail on it — a slow dashboard is a working dashboard, and
      # failing the deploy would leave the fast fix (rolling back) unavailable.
      # It fails only if the app never becomes healthy.
      - name: Wait for a cold start and report it
        run: |
          set -euo pipefail
          url="https://${{ steps.apply.outputs.fqdn }}/_stcore/health"
          start=$(date +%s)
          for attempt in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$url" || true)
            if [ "$code" = "200" ]; then
              elapsed=$(( $(date +%s) - start ))
              echo "healthy after ${elapsed}s (attempt ${attempt})"
              echo "### Cold start: ${elapsed}s" >> "$GITHUB_STEP_SUMMARY"
              [ "$elapsed" -le 30 ] \
                && echo "within the plan's 30s budget" >> "$GITHUB_STEP_SUMMARY" \
                || echo "over the plan's 30s budget — see runbook 4c" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 5
          done
          echo "never returned 200 from $url"
          exit 1

      # **What this proves, and what it does not.** It proves the ingress routes
      # to our container and Streamlit serves its document — not the platform's
      # error page, which also returns HTML.
      #
      # It does NOT prove the database answered, and no `curl` can. Streamlit
      # sends a static shell and then streams every rendered value over a
      # websocket, so the numbers this dashboard exists to show are never in the
      # HTML. An earlier version of this comment claimed the step "looks for a
      # figure that can only come from a real query against Azure SQL"; the code
      # only ever checked the status line, and the check it described is not
      # possible over HTTP.
      #
      # The live queries are covered by `azure-tests.yml`, which connects to
      # Azure SQL directly with `REQUIRE_AZURE=1`. That is the workflow to run
      # when the question is "did the data survive", not this one.
      - name: Check the app itself is serving
        run: |
          set -euo pipefail
          url="https://${{ steps.apply.outputs.fqdn }}/"
          body=$(curl -sS --max-time 30 --fail-with-body "$url")
          # Both markers verified against the live response, not guessed: the
          # shell carries `<title>Streamlit</title>` and loads its bundle from
          # `./static/js/`. Note the title is Streamlit's own, NOT the one
          # `st.set_page_config` sets — that is applied in the browser.
          grep -q '<title>Streamlit</title>' <<<"$body" && grep -q './static/js/' <<<"$body" \
            || { echo "200, but the body is not the Streamlit app:"; head -c 500 <<<"$body"; exit 1; }
          echo "the Streamlit document is being served"

      # Anything that got here and failed deserves the container's own account
      # of it rather than a curl exit code.
      - name: System logs, if something failed
        if: failure()
        run: |
          az containerapp revision list -g rg-h1b -n h1b-web \
            --query "[].{name:name,active:properties.active,state:properties.provisioningState,replicas:properties.replicas}" -o table || true
          az containerapp logs show -n h1b-web -g rg-h1b --type system --tail 50 || true
